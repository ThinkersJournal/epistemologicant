[package]
name = "epistemologicant"
description = "EpistemologicAnt umbrella: one dependency that re-exports the foundation tool crates (credence, evidence, justify, record) behind features"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["credence", "evidence", "justify", "record"]
credence = ["dep:epistemologicant-credence"]
evidence = ["credence", "dep:epistemologicant-evidence"]
justify = ["dep:epistemologicant-justify"]
record = ["credence", "dep:epistemologicant-record"]

[dependencies]
epistemologicant-core = { version = "0.0.3", path = "../epistemologicant-core" }
epistemologicant-credence = { version = "0.0.3", path = "../epistemologicant-credence", optional = true }
epistemologicant-evidence = { version = "0.0.3", path = "../epistemologicant-evidence", optional = true }
epistemologicant-justify = { version = "0.0.3", path = "../epistemologicant-justify", optional = true }
epistemologicant-record = { version = "0.0.3", path = "../epistemologicant-record", optional = true }
